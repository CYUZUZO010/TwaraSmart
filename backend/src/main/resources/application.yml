server:
  port: 8081

spring:
  application:
    name: twarasmart
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:twarasmart}
    username: ${DB_USER:twara_user}
    password: ${DB_PASSWORD:twara_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please-make-it-long-enough}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:5174}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.twarasmart: INFO
    org.springframework.security: WARN
